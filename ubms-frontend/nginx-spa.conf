# Nginx SPA config: Barcha yo'llarni index.html ga yo'naltiradi (Vue Router history mode uchun)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: barcha route'larni index.html ga yo'naltir
    location / {
        try_files $uri $uri/ /index.html;
    }
}
