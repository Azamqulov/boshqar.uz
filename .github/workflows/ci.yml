name: CI/CD Pipeline - Boshqar.uz

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: ⚙️ Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ubms-backend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './ubms-backend/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🧪 Run Unit & Service Tests
        run: npm run test -- --passWithNoTests

      - name: 🏗️ Build Backend Production Bundle
        run: npm run build

  frontend-ci:
    name: 🖥️ Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ubms-frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './ubms-frontend/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ TypeScript Typecheck & Vite Build
        run: npm run build

  bot-ci:
    name: 🤖 Telegram Bot Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ubms-telegram-bot

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './ubms-telegram-bot/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ TypeScript Build
        run: npm run build
