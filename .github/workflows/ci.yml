name: Boshqar.uz CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ubms-backend/package-lock.json

      - name: Install Dependencies
        working-directory: ubms-backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ubms-backend
        run: npx prisma generate

      - name: Run Backend Unit Tests
        working-directory: ubms-backend
        run: npm test

      - name: Build Backend
        working-directory: ubms-backend
        run: npm run build

  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ubms-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ubms-frontend
        run: npm ci

      - name: TypeCheck and Build Frontend
        working-directory: ubms-frontend
        run: npm run build
