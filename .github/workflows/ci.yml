name: CI/CD Pipeline - Boshqar.uz

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: ⚙️ Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install Monorepo Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npm --prefix ubms-backend run prisma:generate

      - name: 🧪 Run Unit & Service Tests
        run: npm --prefix ubms-backend run test -- --passWithNoTests

      - name: 🏗️ Build Backend Production Bundle
        run: npm --prefix ubms-backend run build

  frontend-ci:
    name: 🖥️ Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install Monorepo Dependencies
        run: npm ci

      - name: 🧪 Run Frontend Unit Tests
        run: npm --prefix ubms-frontend run test

      - name: 🏗️ TypeScript Typecheck & Vite Build
        run: npm --prefix ubms-frontend run build

  bot-ci:
    name: 🤖 Telegram Bot Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install Monorepo Dependencies
        run: npm ci

      - name: 🏗️ TypeScript Build
        run: npm --prefix ubms-telegram-bot run build
