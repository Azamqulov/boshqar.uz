name: boshqar.uz CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: 🛡️ Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --prefix ubms-backend run prisma:generate

      - name: Type Check Backend
        run: npm --prefix ubms-backend run build

      - name: Type Check Frontend
        run: npm --prefix ubms-frontend run build

  backend-tests:
    name: 🧪 Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm --prefix ubms-backend run test -- --passWithNoTests
