# ════════════════════════════════════════════════════
#  boshqar.uz — Enterprise CI/CD Pipeline
#  Trigger: push & pull_request -> main branch
# ════════════════════════════════════════════════════

name: Enterprise CI/CD Pipeline - boshqar.uz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ───────────────────────────────────────────────────
  # JOB 1: Frontend - Lint, TypeCheck & Production Build
  # ───────────────────────────────────────────────────
  frontend-build:
    name: "Frontend: TypeCheck & Build"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ubms-frontend/package-lock.json"

      - name: "Install Shared Types"
        run: |
          cd ubms-shared-types
          npm ci

      - name: "Install Frontend Dependencies"
        run: |
          cd ubms-frontend
          npm ci

      - name: "Build Frontend (vue-tsc + vite build)"
        run: |
          cd ubms-frontend
          npm run build

  # ───────────────────────────────────────────────────
  # JOB 2: Backend - Prisma, TypeCheck, Build & Unit Tests
  # ───────────────────────────────────────────────────
  backend-test-build:
    name: "Backend: Tests & Build"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ubms-backend/package-lock.json"

      - name: "Install Backend Dependencies"
        run: |
          cd ubms-backend
          npm ci

      - name: "Prisma Schema Validate & Generate"
        run: |
          cd ubms-backend
          npx prisma validate
          npx prisma generate

      - name: "Run Backend Unit & Integration Tests (Jest)"
        run: |
          cd ubms-backend
          npm test -- --passWithNoTests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          JWT_SECRET: "test-jwt-secret-key-for-ci-only-minimum-32-chars-2026"

      - name: "Build Backend (NestJS Build)"
        run: |
          cd ubms-backend
          npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          JWT_SECRET: "test-jwt-secret-key-for-ci-only-minimum-32-chars-2026"
