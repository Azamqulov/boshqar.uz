# ════════════════════════════════════════════════════
#  boshqar.uz — GitHub Actions CI/CD Pipeline
#  Trigger: push yoki PR -> main branch
#  Jobs:
#    1. frontend-build  — Frontend build va TypeScript tekshiruvi
#    2. backend-build-test — Backend build va unit testlar
#    3. deploy          — Production serverga deploy (SSH)
# ════════════════════════════════════════════════════

name: CI-CD Pipeline - boshqar.uz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ───────────────────────────────────────────────────
  # JOB 1: Frontend Build va TypeScript Check
  # ───────────────────────────────────────────────────
  frontend-build:
    name: "Frontend - Build & Type Check"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout kodi"
        uses: actions/checkout@v4

      - name: "Node.js o'rnatish"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ubms-frontend/package-lock.json"

      - name: "Shared types o'rnatish"
        run: |
          cd ubms-shared-types
          npm ci

      - name: "Frontend dependencies o'rnatish"
        run: |
          cd ubms-frontend
          npm ci

      - name: "Frontend build (vue-tsc + vite)"
        run: |
          cd ubms-frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: "Build artifacts saqlash"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ubms-frontend/dist
          retention-days: 1

  # ───────────────────────────────────────────────────
  # JOB 2: Backend Build va Unit Testlar
  # ───────────────────────────────────────────────────
  backend-build-test:
    name: "Backend - Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout kodi"
        uses: actions/checkout@v4

      - name: "Node.js o'rnatish"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ubms-backend/package-lock.json"

      - name: "Backend dependencies o'rnatish"
        run: |
          cd ubms-backend
          npm ci

      - name: "Backend build (nest build)"
        run: |
          cd ubms-backend
          npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: "Unit testlar ishga tushirish"
        run: |
          cd ubms-backend
          npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: test-jwt-secret-key-for-ci-only

  # ───────────────────────────────────────────────────
  # JOB 3: Production Deploy
  # ───────────────────────────────────────────────────
  deploy:
    name: "Production Deploy"
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://boshqar.uz

    steps:
      - name: "Checkout kodi"
        uses: actions/checkout@v4

      - name: "Docker Hub login"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Docker meta (tag) generatsiya"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/boshqar-backend
            ${{ secrets.DOCKER_USERNAME }}/boshqar-frontend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: "Backend Docker image build va push"
        uses: docker/build-push-action@v5
        with:
          context: ./ubms-backend
          file: ./ubms-backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/boshqar-backend:latest,${{ secrets.DOCKER_USERNAME }}/boshqar-backend:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/boshqar-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/boshqar-backend:buildcache,mode=max

      - name: "Frontend Docker image build va push"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ubms-frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/boshqar-frontend:latest,${{ secrets.DOCKER_USERNAME }}/boshqar-frontend:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/boshqar-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/boshqar-frontend:buildcache,mode=max

      - name: "Serverga SSH orqali deploy"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /opt/boshqar.uz
            docker pull ${{ secrets.DOCKER_USERNAME }}/boshqar-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/boshqar-frontend:latest
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
            docker image prune -f
            echo "Deploy muvaffaqiyatli yakunlandi!"

      - name: "Deploy muvaffaqiyatli xabari"
        if: success()
        run: |
          echo "boshqar.uz production serverga deploy qilindi!"
          echo "Commit: ${{ github.sha }}"
          echo "Kim: ${{ github.actor }}"

      - name: "Deploy xato xabari"
        if: failure()
        run: |
          echo "Deploy muvaffaqiyatsiz bo'ldi! Loglarni tekshiring."
