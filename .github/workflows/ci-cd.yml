# ════════════════════════════════════════════════════
#  boshqar.uz — GitHub Actions CI Pipeline
#  Trigger: push yoki PR -> main branch
#  Jobs:
#    1. frontend-build  — Frontend build va TypeScript tekshiruvi
#    2. backend-build-test — Backend build va unit testlar
# ════════════════════════════════════════════════════

name: CI Pipeline - boshqar.uz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ───────────────────────────────────────────────────
  # JOB 1: Frontend Build va TypeScript Check
  # ───────────────────────────────────────────────────
  frontend-build:
    name: "Frontend - Build & Type Check"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout kodi"
        uses: actions/checkout@v4

      - name: "Node.js o'rnatish"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ubms-frontend/package-lock.json"

      - name: "Shared types o'rnatish"
        run: |
          cd ubms-shared-types
          npm ci

      - name: "Frontend dependencies o'rnatish"
        run: |
          cd ubms-frontend
          npm ci

      - name: "Frontend build (vue-tsc + vite)"
        run: |
          cd ubms-frontend
          npm run build

  # ───────────────────────────────────────────────────
  # JOB 2: Backend Build va Unit Testlar
  # ───────────────────────────────────────────────────
  backend-build-test:
    name: "Backend - Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout kodi"
        uses: actions/checkout@v4

      - name: "Node.js o'rnatish"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ubms-backend/package-lock.json"

      - name: "Backend dependencies o'rnatish"
        run: |
          cd ubms-backend
          npm ci

      - name: "Prisma client generatsiya"
        run: |
          cd ubms-backend
          npx prisma generate

      - name: "Backend build (nest build)"
        run: |
          cd ubms-backend
          npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          JWT_SECRET: "test-jwt-secret-key-for-ci-only-minimum-32-chars"

      - name: "Unit testlar ishga tushirish"
        run: |
          cd ubms-backend
          npm test -- --passWithNoTests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          JWT_SECRET: "test-jwt-secret-key-for-ci-only-minimum-32-chars"
