version: '3.8'

services:
  # ─── Backend (NestJS API) ────────────────────────────────
  backend:
    build:
      context: ./ubms-backend
      dockerfile: Dockerfile
    container_name: boshqar-backend
    restart: unless-stopped
    env_file:
      - ./ubms-backend/.env.production
    environment:
      - NODE_ENV=production
    ports:
      - '4000:4000'
    depends_on:
      - redis
    networks:
      - boshqar-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Frontend (Vue + Nginx) ──────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: ubms-frontend/Dockerfile
    container_name: boshqar-frontend
    restart: unless-stopped
    networks:
      - boshqar-network

  # ─── Nginx Reverse Proxy (SSL Termination) ───────────────
  nginx:
    image: nginx:alpine
    container_name: boshqar-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - boshqar-network

  # ─── Redis (Rate Limiting & Cache) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: boshqar-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - boshqar-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  nginx-logs:

networks:
  boshqar-network:
    driver: bridge
