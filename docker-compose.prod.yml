version: '3.8'

services:
  # ───────────────────────────────────────────────────
  # 1. PostgreSQL 16 Database
  # ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: boshqar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: boshqar_db
      POSTGRES_USER: boshqar_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BoshqarSecureDB2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boshqar_user -d boshqar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boshqar-network

  # ───────────────────────────────────────────────────
  # 2. Redis 7 In-Memory Cache
  # ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: boshqar-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boshqar-network

  # ───────────────────────────────────────────────────
  # 3. NestJS Backend API
  # ───────────────────────────────────────────────────
  backend:
    build:
      context: ./ubms-backend
      dockerfile: Dockerfile
    container_name: boshqar-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://boshqar_user:${DB_PASSWORD:-BoshqarSecureDB2026!}@postgres:5432/boshqar_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-boshqar_uz_jwt_secure_secret_key_minimum_32_chars_2026}
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boshqar-network

  # ───────────────────────────────────────────────────
  # 4. Nginx Reverse Proxy & Static Frontend
  # ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: boshqar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ubms-frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - boshqar-network

networks:
  boshqar-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
